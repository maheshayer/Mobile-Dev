<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firebase Contact Form</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
        font-family: Arial;
      }

      .container {
        width: 400px;
        padding: 25px;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(12px);
        border-radius: 15px;
        color: white;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      input,
      textarea {
        width: 100%;
        margin: 8px 0;
        padding: 10px;
        border: none;
        border-radius: 8px;
        outline: none;
      }

      textarea {
        height: 100px;
        resize: none;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background: white;
        color: #4a3aff;
        font-weight: bold;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      #status {
        margin-top: 10px;
        text-align: center;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Contact Form</h2>

      <input type="text" id="name" placeholder="Name" />
      <input type="email" id="email" placeholder="Email" />
      <input type="text" id="phone" placeholder="Phone" />
      <textarea id="message" placeholder="Message"></textarea>

      <button id="btn" onclick="submitForm()">Submit</button>

      <p id="status"></p>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
